# Правила hum1izer. Формат:
#
#   lit:      подстрока, регистронезависимо
#   re:       регулярка RE2 как есть
#   word_re:  регулярка, обрамлённая границами слова (в Go \b только по ASCII)
#   builtin:  правило, которое считает код: en_dash, fake_range, latin_in_cyrillic
#             (RE2 не умеет lookaround и обратные ссылки)
#
# Внутри регулярок вместо \w пиши [\p{L}]+ или [\p{L}]*: \w в Go тоже только ASCII.
#
# Наборы банов и маркеров, пороги и веса штрафов изначально взяты из
# humanizer-ru (MIT, (c) Ilya Utov): https://github.com/ilyautov/humanizer-ru
# Там же корпусное обоснование порогов: AINL-Eval, LLMTrace, M4-ru.

# lift - во сколько раз маркер чаще у машины, чем у человека. Стоит только там,
# где посчитан, и используется как вес находки при сортировке.
#
# Основной источник - свой замер на LLMTrace (iitolstykh/LLMTrace_detection,
# Apache-2.0): 2708 человеческих и 1455 машинных текстов на русском, генераторы
# gpt-4, o3-2025, gigachat, Qwen2.5-72B. Пересчитывается командой
#   go run ./eval/lift --file valid.jsonl --lang ru
# Четыре значения помечены комментарием - они из каталога humanizer-ru
# (AINL-Eval и M4-ru, генераторы 2023-2024), в нашем корпусе этих маркеров
# слишком мало для замера.
#
# Числа домен-зависимы: тот же «Является» даёт 2.5 у нас, 4.5 на смешанном
# регистре у humanizer-ru и 0.1 на научном. Жанр важнее самого веса.
#
# Маркеры с lift ниже 1.2 веса не получают: длинное тире в русском дало 0.94,
# то есть у человека оно чаще, а латиница внутри кириллицы 0.28 - это опечатки
# людей, а не след машины.
version: 1

thresholds:
  cv_human_target: 0.45    # цель по разбросу длин предложений
  cv_ai_threshold: 0.35    # ниже — ритм считается ровным
  nominal_target: 3.0      # отглагольных существительных на 100 слов
  para_cv_ai: 0.35         # ниже — абзацы одной длины
  para_min_count: 6        # меньше абзацев — о ритме не судим
  listicle_share_ai: 0.30  # доля строк-пунктов выше — листикл
  listicle_min_items: 6
  band_clean: 85           # ≥ — чисто
  band_edit: 60            # ≥ — точечная правка, ниже — рерайт

# Баны по плотности: маркер становится баном от двух вхождений и чаще 1 на N слов.
freq_bans:
  Является: 500

hard_bans:
  - name: Не просто X, а Y
    fix: 'State the claim directly: keep only Y'
    lift: 8.3
    re: 'не\s+просто[^.!?]{1,40}?[^\p{L}]а[^\p{L}]'
  - name: Не только X, но и Y
    fix: '"X. And Y" or a plain list'
    lift: 4.1
    re: 'не\s+только[^.!?]{1,40}?но\s+и[^\p{L}]'
  - name: В современном мире
    fix: Start with a fact or question from the text itself
    word_re: 'в\s+современном\s+мире'
    tests: [{text: "В современном мире данные решают", expect: true}, {text: "в современных реалиях", expect: false}]
  - name: Стоит отметить, что
    fix: Drop the lead-in, keep the claim
    lift: 2.5
    word_re: 'стоит\s+отметить'
  - name: Важно понимать/помнить/отметить, что
    fix: Drop the lead-in, keep the claim
    lift: 15.1
    word_re: 'важно\s+(?:понимать|помнить|отметить)'
    tests: [{text: "Важно понимать, что кэш не мгновенный", expect: true}, {text: "неважно понимать, что там", expect: false}]
  # Только единственное число: «данные» — это существительное, а не маркер.
  - name: Данный/Данная/Данное
    fix: Replace with этот / эта / это
    lift: 2.2
    word_re: 'данн(?:ый|ая|ое|ого|ой|ом|ую)'
    tests: [{text: "В данном случае ответ кэшируется", expect: true}, {text: "данные загружаются из API", expect: false}]
  - name: Является
    fix: Restructure the sentence to drop the copula
    lift: 2.5
    word_re: 'явля(?:ется|ются)'
    tests: [{text: "Слой является тонкой обёрткой", expect: true}, {text: "Проблема проявляется только на Windows", expect: false}]
  - name: Играет важную/ключевую роль
    fix: Keep only WHY it matters, if the text says so
    lift: 9.4  # замер humanizer-ru, своего нет
    word_re: 'игра(?:ет|ют)\s+(?:важн[\p{L}]+|ключев[\p{L}]+)\s+роль'
  - name: Можно с уверенностью сказать
    fix: Say it without the preamble
    word_re: 'можно\s+с\s+уверенностью\s+сказать'
  # «Таким образом» банится только как вводный коннектор-вывод. Омонимичное
  # обстоятельство «устроен таким образом, что» — живая речь, под бан не идёт.
  - name: Подводя итог / Таким образом
    fix: 'Cut it, or open the conclusion with an action. "Устроен таким образом, что" is not a marker'
    lift: 4.3
    re: '(?:(?:^|[^\p{L}\p{N}_])подводя\s+итог(?:[^\p{L}\p{N}_]|$))|(?:(?:^|[.!?…:;]\s+|\n\s*(?:[-*•]\s*)?|,\s*)таким\s+образом\s*,)'
  - name: Em dash
    fix: Use a comma, colon, period, or hyphen; or restructure the sentence
    re: '—'
    tests: [{text: "Кэш — не серебряная пуля", expect: true}, {text: "Кэш: не серебряная пуля", expect: false}]
  - name: En dash
    fix: Legitimate in Russian typography only for numeric ranges
    builtin: en_dash
    tests: [{text: "заметки–наброски", expect: true}, {text: "2019–2024", expect: false}]
  - name: от X до Y (ложный диапазон)
    fix: List specifics, or cut it
    lift: 2.1
    builtin: fake_range
    tests: [{text: "от простого до сложного", expect: true}, {text: "от Москвы до Твери", expect: false}]
  - name: В условиях [прил.] [сущ.]
    fix: Start with a fact from the text itself
    lift: 3.7
    word_re: 'в\s+условиях\s+[\p{L}]+'
  - name: Погрузимся / посмотрим поближе
    fix: Cut the announcement, get straight to the point
    word_re: '(?:погрузимся|посмотрим\s+[\p{L}]+\s+поближе|давайте\s+посмотрим)'
  - name: И вот здесь начинается самое интересное
    fix: Cut the announcement, get straight to the point
    word_re: 'вот\s+(?:здесь|тут)\s+начинается\s+самое\s+интересное'
  - name: Раскрыть потенциал
    fix: Name the concrete result if the text gives one; otherwise cut it
    word_re: 'раскры(?:ть|ва[\p{L}]+)\s+потенциал'
  - name: Вывести на новый уровень
    fix: Name the concrete result if the text gives one; otherwise cut it
    word_re: 'выв(?:ести|одит)\s+на\s+новый\s+уровень'
  - name: Комплексный подход/решение
    fix: List what it includes; otherwise cut it
    lift: 2.8  # замер humanizer-ru, своего нет
    word_re: 'комплексн(?:ый|ое|ого|ым)\s+(?:подход[\p{L}]*|решени[\p{L}]+)'
  - name: В связи с этим
    fix: Cut it, or show the link using the source's own words
    word_re: 'в\s+связи\s+с\s+этим'
  - name: Открывает новые горизонты/перспективы/возможности
    fix: Name the concrete result if one is given; otherwise cut it
    word_re: 'открыва(?:ет|ют)\s+новые\s+(?:горизонт|перспектив|возможност)[\p{L}]+'

categories:
  - name: Bureaucratese
    fix: 'Turn the nominalization into a verb: "осуществить установку" -> "установить"'
    lift: 2.8
    rules:
      - lit: осуществлени
      - lit: реализаци
      - lit: внедрени
      - lit: оптимизаци
      - lit: функционировани
      - lit: взаимодействи
      - lit: в рамках
      - lit: в целях
      - lit: в контексте
      - lit: на основе
      - lit: посредством
      - lit: в соответствии с
      - lit: внимание уделяется
      - lit: внимание уделено
      - name: посвящена анализу/изучению/разработке
        re: 'посвящен[ао]\s+(?:анализ|изучени|разработк|рассмотрени)[\p{L}]+'

  - name: Calques
    fix: 'Rephrase in natural Russian: the calque usually drops with no loss of meaning'
    lift: 2.2
    rules:
      - name: является
        word_re: 'явля(?:ется|ются)'
      - lit: стоит отметить
      - lit: важно понимать
      - lit: можно сказать
      - lit: что касается
      - lit: в то время как
      - lit: с другой стороны
      - lit: тем не менее
      - lit: несмотря на то что
      - lit: стоит помнить
      - lit: следует учитывать
      - lit: необходимо отметить
      - name: исследование фокусируется на
        re: '(?:исследовани|работ|стать)[\p{L}]+\s+фокусиру[\p{L}]+\s+на'

  - name: Empty intensifiers
    fix: Cut the intensifier, or replace it with what specifically changed
    lift: 1.9
    rules:
      - lit: ключев
      - lit: важнейш
      - lit: значительн
      - lit: огромн
      - lit: колоссальн
      - lit: переломн
      - lit: фундаментальн
      - lit: невозможно переоценить
      - lit: играет роль
      - name: важный шаг
        word_re: 'важн[\p{L}]+\s+шаг[\p{L}]*'

  - name: Conclusion formulas
    fix: Cut the conclusion formula; open the conclusion with an action or a fact
    lift: 6.4
    rules:
      - name: таким образом, (вводное)
        re: '(?:^|[.!?…:;]\s+|\n\s*(?:[-*•]\s*)?|,\s*)таким\s+образом\s*,'
      - lit: подводя итог
      - lit: в заключение
      - lit: можно сделать вывод
      - lit: суммируя вышесказанное
      - lit: на основании вышеизложенного

  - name: Chatbot artifacts
    fix: 'Chat-assistant artifact: delete it entirely'
    lift: 1.6
    rules:
      - lit: 'конечно!'
      - lit: отличный вопрос
      - lit: давайте разберёмся
      - lit: давайте разберемся
      - lit: рад помочь
      - lit: надеюсь это было полезно
      - lit: с удовольствием

  # «это не X, это Y» — конструкция, а не любое отрицание: «это не может не
  # радовать» живая речь и маркером не считается.
  - name: Parallelisms
    fix: Replace the empty contrast with a direct statement
    lift: 2.7
    rules:
      - lit: не просто
      - lit: не только
      - name: это не X, это Y
        re: 'это\s+не\s+[^.!?\n]{1,40}[,—:-]\s*это(?:[^\p{L}\p{N}_]|$)'
        tests: [{text: "Это не баг, это фича", expect: true}, {text: "это не просто баг", expect: false}]

  - name: Opening hooks
    fix: Start with a fact or question from the text itself
    lift: 3.2
    rules:
      - lit: в современном мире
      - lit: в эпоху
      - lit: не секрет что
      - lit: 'не секрет, что'
      - lit: всё чаще
      - lit: все чаще
      - lit: по мнению экспертов
      - lit: специалисты отмечают

  - name: Modal hedges
    fix: Either name the condition it works under, or cut the phrase
    lift: 2.7
    rules:
      - lit: может стать
      - lit: может повлиять
      - lit: может быть полезн
      - lit: способен обеспечить
      - lit: призван решить
      - lit: позволяет достичь

  - name: Motivational cliches
    fix: Name the concrete result if the text gives one; otherwise cut it
    lift: 4.0  # замер humanizer-ru, своего нет
    rules:
      - lit: раскрыть потенциал
      - lit: погрузимся
      - lit: вывести на новый уровень
      - lit: открывает новые горизонты
      - lit: открывает новые возможности
      - lit: расширить границы
      - lit: комплексный подход

  - name: Contextualizers
    fix: 'Cut the lead-in: the fact stands on its own'
    lift: 1.8
    rules:
      - lit: в условиях
      - lit: в свете
      - lit: на фоне
      - lit: с учётом
      - lit: с учетом
      - lit: принимая во внимание
      - lit: в связи с этим

  - name: Marketing cliches
    fix: Replace with what actually happens
    rules:
      - lit: связь с аудиторией
      - lit: доверительные отношения
      - lit: ключевой момент
      - lit: ключевая роль
      - lit: индивидуальный подход
      - lit: инновационное решение

  - name: Pseudo-Socratic
    fix: Cut the rhetorical question, keep the answer
    rules:
      - lit: 'зачем? потому что'
      - lit: 'и что? а то'
      - lit: 'почему? сейчас расскажу'

  - name: Authoritative truisms
    fix: Cut the importance formula, keep the statement itself
    rules:
      - lit: вот ключевой вывод
      - lit: самое важное — это
      - lit: самое важное - это
      - lit: первый шаг — это
      - lit: первый шаг - это
      - lit: по своей сути
      - lit: в конечном счёте
      - lit: в конечном счете

  - name: Pseudo-therapeutic
    fix: "Cut it: the reader didn't ask for reassurance"
    rules:
      - lit: ты не ошибаешься
      - lit: ты имеешь право
      - lit: тихое подтверждение
      - lit: это не слабость
      - lit: ты настоящий
      - lit: сам факт этого

  # Разговорное «честно говоря» и жанровый «честный обзор» сюда не входят:
  # это живая речь и конвенция заголовка, а не самомаркировка.
  - name: Honesty self-labeling
    fix: Don't promise honesty, show the facts
    rules:
      - name: честный список
        word_re: 'честн(?:ый|ого|ому|ым|ом)\s+спис[\p{L}]*'
        tests: [{text: "честный список изменений", expect: true}, {text: "честно о списках", expect: false}]
      - name: буду (с вами) откровенен
        word_re: 'буду\s+(?:с\s+(?:вами|тобой)\s+)?откровен[\p{L}]+'
        tests: [{text: "буду с вами откровенным: архитектура не тянет", expect: true}, {text: "буду краток", expect: false}]
      - lit: без прикрас
      - name: без воды
        word_re: 'без\s+воды'
        tests: [{text: "статья без воды", expect: true}, {text: "без водяных знаков", expect: false}]
      - name: объективный разбор
        word_re: 'объективн[\p{L}]+\s+разбор[\p{L}]*'
      - name: это не очередной
        word_re: 'это\s+не\s+очередн[\p{L}]*'
        tests: [{text: "это не очередной фреймворк", expect: true}, {text: "это не очередь сообщений", expect: false}]

  - name: Emoji decoration
    fix: Delete decorative emoji
    lift: 10.0
    rules:
      - lit: '⚡'
      - lit: '✨'
      - lit: '🎯'
      - lit: '🔥'
      - lit: '💡'

  # Латиница в IT-тексте законна, но кириллицей с двух сторон она не окружена.
  - name: Technical markers
    fix: 'Character substitution: restore Cyrillic, strip invisible characters'
    lift: 2.1
    rules:
      - name: Latin inside a Cyrillic word
        builtin: latin_in_cyrillic
        tests: [{text: "интернеtмагазин", expect: true}, {text: "HTTP-сервер", expect: false}]
      - name: invisible characters (zero-width, bidi)
        # Литералы держать нельзя: их не видно в диффе, и GitHub ругается на
        # bidirectional Unicode. ZWSP/ZWNJ/ZWJ, BOM, word joiner, bidi-метки,
        # изоляторы и узкий неразрывный пробел — перечислены кодами.
        re: '[\x{200b}\x{200c}\x{200d}\x{feff}\x{2060}\x{180e}\x{200e}\x{200f}\x{202a}-\x{202e}\x{2066}-\x{2069}\x{061c}\x{202f}]'
        tests: [{text: "скрытый\u200Bсимвол", expect: true}, {text: "обычный текст", expect: false}]

  - name: Inanimate subject
    fix: 'Bring back an actual agent: not "the paper demonstrates" but "we showed"'
    lift: 2.7  # замер humanizer-ru, своего нет
    rules:
      - name: abstraction or object as subject
        re: '(?:исследовани|работ[аы]|стать|проект|платформ|систем|решени|компани|здани|документ|отчёт|инициатив|технологи|подход)[\p{L}]*\s+(?:подчёркива|демонстрир|отража|обеспечива|иллюстрир|символизир|подтвержда)[\p{L}]+'

  - name: Negation triad
    fix: 'Formula "Без X. Без Y. Только Z." - rewrite it as a plain sentence'
    rules:
      - name: Без X. Без Y. Только Z.
        re: '(?:^|[.!?…\n]\s*)(?:без|ни)\s+[^.!?\n]{1,40}[.!?]\s+(?:без|ни)\s+[^.!?\n]{1,40}[.!?]\s+(?:только|просто|лишь)(?:[^\p{L}\p{N}_]|$)'

  # Указательное «этой/сей/эта» обязательно, иначе под маркер уходит разбор
  # басни и оборот «история учит нас осторожности», который человек пишет сам.
  - name: Closing moral
    fix: 'Cut the spelled-out moral: let the reader draw the conclusion'
    rules:
      - name: мораль этой истории
        word_re: 'мораль\s+(?:этой|всей\s+этой|сей)\s+истори(?:и|ю|ей)'
      - name: эта история учит нас
        word_re: '(?:эта|вся\s+эта)\s+истори(?:я|и)\s+(?:учит|научила|учила)\s+(?:нас|нам)'
      - name: эта история о том, что
        word_re: 'эта\s+истори(?:я|и)\s+о\s+том,\s+что'
      - name: мораль проста (последней фразой)
        re: '[.!?…]\s+мораль\s+(?:проста|такова)[^.!?]{0,60}[.!?]\s*$'

  # Технические следы копирования из интерфейса чат-бота: в человеческом тексте
  # не встречаются, поэтому штраф отдельный и тяжёлый.
  - name: Copy-paste artifacts
    fix: 'Text pasted from a chatbot reply: strip the service markup'
    rules:
      - lit: ':contentReference'
      - lit: oai_citation
      - lit: utm_source=chatgpt.com
      - lit: utm_source=openai
      - lit: 'grok_card://'
      - lit: 'attached_file://'
      - lit: vertexaisearch.cloud.google.com/grounding-api-redirect
      - lit: '](sandbox:/mnt/data/'
      - lit: attributableIndex
      - lit: grok_render_citation_card_json
      - name: oaicite
        re: 'oaicite:\d+'
      - name: turnNsearchN
        re: 'turn\d+(?:search|fetch|file)\d+'
      - name: citeturn
        re: 'citeturn\d+[a-z]+\d+'
      - name: 【N†source】
        re: '【\d+(?::\d+)?†source】'
      - name: '[citation:N]'
        re: '\[citation:\d+\]'
      - name: invisible citation separators
        re: '[\x{e200}-\x{e204}]'
      - name: <think>
        re: '</?think>'
      - name: '::::writing{variant='
        re: '::::writing\{variant='
      - name: '[cite: N]'
        re: '\[cite:\s*\d+\]'
      - name: '[span_N](start_span)'
        re: '\[span_\d+\]\(start_span\)'

# Категория, попадания в которую сразу означают вставку из чат-бота.
copy_paste_category: Copy-paste artifacts

# Жанровый фильтр: часть банов в отдельных регистрах не признак машины, а норма.
# Без жанра режим строгий, под него откалиброваны пороги.
genres:
  marketing:
    mute_bans: []
    mute_categories: []
  academic:
    # научный текст ровнее разговорного: порог CV из voice.toml humanize-text-skill
    cv_human_target: 0.35
    mute_bans:
      - 'Является'
      - 'Em dash'
      - 'En dash'
      - 'Данный/Данная/Данное'
      - 'В условиях [прил.] [сущ.]'
      - 'Подводя итог / Таким образом'
      - 'В связи с этим'
    mute_categories: ['Bureaucratese', 'Calques', 'Contextualizers', 'Conclusion formulas']
  legal:
    # юридический ещё ровнее: порог CV из voice.toml humanize-text-skill
    cv_human_target: 0.35
    mute_bans:
      - 'Является'
      - 'Данный/Данная/Данное'
      - 'В условиях [прил.] [сущ.]'
      - 'В связи с этим'
      - 'Em dash'
      - 'En dash'

name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not formatted:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          # Версия закреплена: latest в action отстаёт и подсовывает golangci-lint,
          # собранный go старее целевой версии из go.mod.
          version: v2.13.2
      - run: go test -race ./...
      # Инструмент проверяет сам себя: правило легко сломать правкой регулярки,
      # и тесты этого не увидят. Ругается только на то, чего нет в снимке.
      - name: hum1izer on itself
        run: go run . --code --quiet .
